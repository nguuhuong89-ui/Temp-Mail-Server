kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
# Replit deployments cannot accept inbound SMTP (port 25 is not exposed
# publicly). Disable the embedded listener in production — mail intake on
# Replit happens via your custom-domain MX pointing at a self-hosted Docker
# node. Set to 2525 (or 25) only when running via docker-compose.
SMTP_PORT = "0"

[services.production.health.startup]
path = "/api/healthz"
