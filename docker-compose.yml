services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tempmail
      POSTGRES_PASSWORD: tempmail_strong_2025
      POSTGRES_DB: tempmail
    volumes:
      - pgdata2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempmail"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- Database ---
      DATABASE_URL: postgres://tempmail:tempmail_strong_2025@postgres:5432/tempmail
      # --- Server ---
      PORT: "8080"
      NODE_ENV: production
      # --- SMTP: set to 0 to disable embedded SMTP listener ---
      SMTP_PORT: ${SMTP_PORT:-25}
      # --- Mail ---
      MAIL_DOMAIN: ${MAIL_DOMAIN:-mail.vnsi.app}
      # --- Admin panel (required in production) ---
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      # --- Clerk user accounts (optional — remove if not using auth) ---
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      # --- Auto-promote these emails to admin+pro on first login ---
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # --- Logging ---
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8080"
    ports:
      # SMTP: change "25:25" to "2525:25" if host port 25 is taken
      - "${SMTP_HOST_PORT:-25}:25"
    networks:
      - default
      - coolify

  web:
    build:
      context: .
      target: web
      args:
        # VITE_ vars are baked into the frontend bundle at build time
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"
    networks:
      - default
      - coolify

networks:
  coolify:
    external: true

volumes:
  pgdata2:
