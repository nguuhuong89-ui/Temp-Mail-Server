services:
  # ---------------------------------------------------------------
  # PostgreSQL — bundled database (skip if using an external DB)
  # Set DATABASE_URL in .env to use an external Postgres instead.
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tempmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tempmail}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tempmail}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # ---------------------------------------------------------------
  # API server (Express + embedded SMTP)
  # ---------------------------------------------------------------
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- Database ---
      # Override with an external DATABASE_URL if not using bundled postgres
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-tempmail}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tempmail}}
      # --- Server ---
      PORT: "8080"
      NODE_ENV: production
      # --- SMTP: set to 0 to disable the embedded SMTP listener ---
      SMTP_PORT: ${SMTP_PORT:-25}
      # --- Mail domain (must match your MX record) ---
      MAIL_DOMAIN: ${MAIL_DOMAIN:?MAIL_DOMAIN is required}
      # --- Admin panel token (required — use: openssl rand -hex 32) ---
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required}
      # --- Clerk user accounts (optional — leave empty to disable) ---
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      # --- Auto-promote emails to admin+pro on first login ---
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # --- Logging (trace|debug|info|warn|error) ---
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8080"
    ports:
      # SMTP: change to "2525:25" if host port 25 is taken
      - "${SMTP_HOST_PORT:-25}:25"
    networks:
      - default
      - coolify

  # ---------------------------------------------------------------
  # Web frontend (Nginx serving built React app + API proxy)
  # ---------------------------------------------------------------
  web:
    build:
      context: .
      target: web
      args:
        # VITE_ vars are baked into the frontend bundle at build time.
        # Must be passed as build args — setting them in environment: has no effect.
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - default
      - coolify

volumes:
  pgdata:

networks:
  coolify:
    external: true
    # If not using Coolify, comment out the block above and use:
    # coolify:
    #   driver: bridge
