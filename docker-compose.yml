services:
  # ---------------------------------------------------------------
  # PostgreSQL — bundled database (for local/self-host without Coolify)
  # Only starts when using: docker compose --profile local up
  # When deploying on Coolify: set DATABASE_URL env var directly,
  # this service will NOT start (profiles: [local] won't be activated).
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    profiles: [local]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tempmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tempmail}
      POSTGRES_DB: ${POSTGRES_DB:-tempmail}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tempmail}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # ---------------------------------------------------------------
  # API server (Express + embedded SMTP)
  # ---------------------------------------------------------------
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      # --- Database ---
      # On Coolify: set DATABASE_URL in the environment variables panel.
      # For local with bundled postgres: leave as-is (uses postgres service above).
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-tempmail}:${POSTGRES_PASSWORD:-tempmail}@postgres:5432/${POSTGRES_DB:-tempmail}}
      # --- Server ---
      PORT: "8080"
      NODE_ENV: production
      # --- SMTP: set to 0 to disable the embedded SMTP listener ---
      SMTP_PORT: ${SMTP_PORT:-25}
      # --- Mail domain (must match your MX record) ---
      MAIL_DOMAIN: ${MAIL_DOMAIN:-mail.example.com}
      # --- Admin panel token (required — use: openssl rand -hex 32) ---
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change_me}
      # --- Clerk user accounts (optional — leave empty to disable) ---
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      # --- Auto-promote emails to admin+pro on first login ---
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # --- Logging (trace|debug|info|warn|error) ---
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8080"
    ports:
      # SMTP: set SMTP_HOST_PORT=2525 if host port 25 is taken
      - "${SMTP_HOST_PORT:-25}:25"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/api/healthz').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    networks:
      - default
      - coolify

  # ---------------------------------------------------------------
  # Web frontend (Nginx serving built React app + API proxy)
  # Uses dynamic DNS resolution (resolver 127.0.0.11) so nginx
  # re-resolves the api hostname after container restarts.
  # ---------------------------------------------------------------
  web:
    build:
      context: .
      target: web
      args:
        # VITE_ vars are baked into the frontend bundle at build time.
        # Must be passed as build args — setting them in environment: has no effect.
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
        VITE_CLERK_PROXY_URL: ${VITE_CLERK_PROXY_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - coolify

volumes:
  pgdata:

networks:
  coolify:
    external: true
